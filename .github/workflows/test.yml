name: Tests

# The suite runs twice: without the binder checkout (its tests skip) and with
# python-multiplatform develop beside it. The tests only read three Kotlin
# source files from it, so no JVM or Gradle is needed.
on:
  # Development runs are started by hand only (owner, 2026-11-14: "개발 테스트 ci는
  # 명시적으로 실행하기").
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One development run per repository: a run in progress finishes, and a newer dispatch replaces
  # the waiting one (owner, 2026-11-14: "제일 최신꺼만 도는게 맞지").
  group: dev-ci
  cancel-in-progress: false

jobs:
  no-binder:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.15']
    env:
      # A path that does not exist, so the binder tests skip.
      PYTHONMULTIPLATFORM_HOME: /nonexistent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest mypy setuptools wheel
      - name: Run the suite
        run: python -m pytest tests -q -rs

  with-binder:
    runs-on: ubuntu-latest
    env:
      # The two repositories side by side, as on a developer machine. The binder is not checked out
      # inside this one: tests/test_wheel.py copies this repository to build the wheel.
      PYTHONMULTIPLATFORM_HOME: ${{ github.workspace }}/python-multiplatform
    defaults:
      run:
        working-directory: pythonx-compose
    steps:
      - uses: actions/checkout@v4
        with:
          path: pythonx-compose
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: thisisthepy/python-multiplatform
          ref: develop
          path: python-multiplatform
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      # pyrefly, pinned as python-multiplatform's TypedPython gate pins it, for tests/test_typedpython.py.
      - run: pip install pytest mypy setuptools wheel "pyrefly==1.3.2"
      - name: Run the suite
        run: python -m pytest tests -q -rs

  # A failed daily run opens one issue (or comments on the open one) so a binder change that breaks
  # this package is seen without anyone watching the Actions tab.
  report-scheduled-failure:
    needs: [no-binder, with-binder]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the tracking issue
        run: |
          title="Daily tests fail against python-multiplatform develop"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          body="The scheduled run failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
